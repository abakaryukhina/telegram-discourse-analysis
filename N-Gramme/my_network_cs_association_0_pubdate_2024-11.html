        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',

              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "Ankunft", "label": "Ankunft", "shape": "dot"}, {"color": "#97c2fc", "id": "Kiew", "label": "Kiew", "shape": "dot"}, {"color": "#97c2fc", "id": "Tod", "label": "Tod", "shape": "dot"}, {"color": "#97c2fc", "id": "12", "label": "12", "shape": "dot"}, {"color": "#97c2fc", "id": "Mensch", "label": "Mensch", "shape": "dot"}, {"color": "#97c2fc", "id": "Hochhaus", "label": "Hochhaus", "shape": "dot"}, {"color": "#97c2fc", "id": "hei\u00dfen", "label": "hei\u00dfen", "shape": "dot"}, {"color": "#97c2fc", "id": "sagen", "label": "sagen", "shape": "dot"}, {"color": "#97c2fc", "id": "warnen", "label": "warnen", "shape": "dot"}, {"color": "#97c2fc", "id": "ukrainisch", "label": "ukrainisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Kommentator", "label": "Kommentator", "shape": "dot"}, {"color": "#97c2fc", "id": "Russe", "label": "Russe", "shape": "dot"}, {"color": "#97c2fc", "id": "Drohnenangriff", "label": "Drohnenangriff", "shape": "dot"}, {"color": "#97c2fc", "id": "russisch", "label": "russisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Stadt", "label": "Stadt", "shape": "dot"}, {"color": "#97c2fc", "id": "freuen", "label": "freuen", "shape": "dot"}, {"color": "#97c2fc", "id": "zerst\u00f6ren", "label": "zerst\u00f6ren", "shape": "dot"}, {"color": "#97c2fc", "id": "Rakete", "label": "Rakete", "shape": "dot"}, {"color": "#97c2fc", "id": "Geb\u00e4ude", "label": "Geb\u00e4ude", "shape": "dot"}, {"color": "#97c2fc", "id": "Bewohner", "label": "Bewohner", "shape": "dot"}, {"color": "#97c2fc", "id": "begraben", "label": "begraben", "shape": "dot"}, {"color": "#97c2fc", "id": "Tr\u00fcmmer", "label": "Tr\u00fcmmer", "shape": "dot"}, {"color": "#97c2fc", "id": "C\u0027est", "label": "C\u0027est", "shape": "dot"}, {"color": "#97c2fc", "id": "--", "label": "--", "shape": "dot"}, {"color": "#97c2fc", "id": "vie", "label": "vie", "shape": "dot"}, {"color": "#97c2fc", "id": "interessant", "label": "interessant", "shape": "dot"}, {"color": "#97c2fc", "id": "beobachten", "label": "beobachten", "shape": "dot"}, {"color": "#97c2fc", "id": "Leute", "label": "Leute", "shape": "dot"}, {"color": "#97c2fc", "id": "zuvor", "label": "zuvor", "shape": "dot"}, {"color": "#97c2fc", "id": "Oh", "label": "Oh", "shape": "dot"}, {"color": "#97c2fc", "id": "Meerjungfraue", "label": "Meerjungfraue", "shape": "dot"}, {"color": "#97c2fc", "id": "Kobzon", "label": "Kobzon", "shape": "dot"}, {"color": "#97c2fc", "id": "Konzert", "label": "Konzert", "shape": "dot"}, {"color": "#97c2fc", "id": "null", "label": "null", "shape": "dot"}, {"color": "#97c2fc", "id": "gehen", "label": "gehen", "shape": "dot"}, {"color": "#97c2fc", "id": "Oh-oh", "label": "Oh-oh", "shape": "dot"}, {"color": "#97c2fc", "id": "Schlampe", "label": "Schlampe", "shape": "dot"}, {"color": "#97c2fc", "id": "wissen", "label": "wissen", "shape": "dot"}, {"color": "#97c2fc", "id": "friedlich", "label": "friedlich", "shape": "dot"}, {"color": "#97c2fc", "id": "k\u00e4mpfen", "label": "k\u00e4mpfen", "shape": "dot"}, {"color": "#97c2fc", "id": "Land", "label": "Land", "shape": "dot"}, {"color": "#97c2fc", "id": "Tier", "label": "Tier", "shape": "dot"}, {"color": "#97c2fc", "id": "objektiv", "label": "objektiv", "shape": "dot"}, {"color": "#97c2fc", "id": "sehen", "label": "sehen", "shape": "dot"}, {"color": "#97c2fc", "id": "Seite", "label": "Seite", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "Ankunft", "to": "Kiew"}, {"from": "Kiew", "to": "Tod"}, {"from": "Tod", "to": "12"}, {"from": "12", "to": "Mensch"}, {"from": "Mensch", "to": "Hochhaus"}, {"from": "Hochhaus", "to": "hei\u00dfen"}, {"from": "hei\u00dfen", "to": "sagen"}, {"from": "sagen", "to": "warnen"}, {"from": "warnen", "to": "ukrainisch"}, {"from": "ukrainisch", "to": "Kommentator"}, {"from": "Kommentator", "to": "Tod"}, {"from": "Tod", "to": "Russe"}, {"from": "Russe", "to": "Drohnenangriff"}, {"from": "Drohnenangriff", "to": "russisch"}, {"from": "russisch", "to": "Stadt"}, {"from": "Stadt", "to": "freuen"}, {"from": "freuen", "to": "zerst\u00f6ren"}, {"from": "zerst\u00f6ren", "to": "russisch"}, {"from": "russisch", "to": "Rakete"}, {"from": "Rakete", "to": "Geb\u00e4ude"}, {"from": "Geb\u00e4ude", "to": "ukrainisch"}, {"from": "ukrainisch", "to": "Bewohner"}, {"from": "Bewohner", "to": "begraben"}, {"from": "begraben", "to": "Tr\u00fcmmer"}, {"from": "Tr\u00fcmmer", "to": "C\u0027est"}, {"from": "C\u0027est", "to": "--"}, {"from": "--", "to": "vie"}, {"from": "vie", "to": "interessant"}, {"from": "interessant", "to": "beobachten"}, {"from": "beobachten", "to": "Leute"}, {"from": "Leute", "to": "zuvor"}, {"from": "zuvor", "to": "Oh"}, {"from": "Oh", "to": "Meerjungfraue"}, {"from": "Meerjungfraue", "to": "Kobzon"}, {"from": "Kobzon", "to": "Konzert"}, {"from": "Konzert", "to": "null"}, {"from": "null", "to": "gehen"}, {"from": "gehen", "to": "Oh-oh"}, {"from": "Oh-oh", "to": "russisch"}, {"from": "russisch", "to": "Schlampe"}, {"from": "Schlampe", "to": "wissen"}, {"from": "wissen", "to": "friedlich"}, {"from": "friedlich", "to": "Mensch"}, {"from": "Mensch", "to": "k\u00e4mpfen"}, {"from": "k\u00e4mpfen", "to": "Land"}, {"from": "Land", "to": "Tier"}, {"from": "Tier", "to": "objektiv"}, {"from": "objektiv", "to": "sehen"}, {"from": "sehen", "to": "ukrainisch"}, {"from": "ukrainisch", "to": "Seite"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
