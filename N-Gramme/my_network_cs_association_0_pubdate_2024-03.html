        <script type="text/javascript">

              // initialize global variables.

              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "K\u00e4mpfer", "label": "K\u00e4mpfer", "shape": "dot"}, {"color": "#97c2fc", "id": "Veteran", "label": "Veteran", "shape": "dot"}, {"color": "#97c2fc", "id": "unser", "label": "unser", "shape": "dot"}, {"color": "#97c2fc", "id": "Kanal", "label": "Kanal", "shape": "dot"}, {"color": "#97c2fc", "id": "Tschetschenien-Feldzug", "label": "Tschetschenien-Feldzug", "shape": "dot"}, {"color": "#97c2fc", "id": "Bosnien", "label": "Bosnien", "shape": "dot"}, {"color": "#97c2fc", "id": "Kosovo", "label": "Kosovo", "shape": "dot"}, {"color": "#97c2fc", "id": "Metochie", "label": "Metochie", "shape": "dot"}, {"color": "#97c2fc", "id": "tschetschenisch", "label": "tschetschenisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Feldzug", "label": "Feldzug", "shape": "dot"}, {"color": "#97c2fc", "id": "Mazedonium", "label": "Mazedonium", "shape": "dot"}, {"color": "#97c2fc", "id": "Irak", "label": "Irak", "shape": "dot"}, {"color": "#97c2fc", "id": "Afghanistan", "label": "Afghanistan", "shape": "dot"}, {"color": "#97c2fc", "id": "2000er", "label": "2000er", "shape": "dot"}, {"color": "#97c2fc", "id": "Donbass", "label": "Donbass", "shape": "dot"}, {"color": "#97c2fc", "id": "Afrika", "label": "Afrika", "shape": "dot"}, {"color": "#97c2fc", "id": "SVO", "label": "SVO", "shape": "dot"}, {"color": "#97c2fc", "id": "herzlich", "label": "herzlich", "shape": "dot"}, {"color": "#97c2fc", "id": "Gl\u00fcckwunsch", "label": "Gl\u00fcckwunsch", "shape": "dot"}, {"color": "#97c2fc", "id": "w\u00fcnschen", "label": "w\u00fcnschen", "shape": "dot"}, {"color": "#97c2fc", "id": "lang", "label": "lang", "shape": "dot"}, {"color": "#97c2fc", "id": "Leben", "label": "Leben", "shape": "dot"}, {"color": "#97c2fc", "id": "Foto", "label": "Foto", "shape": "dot"}, {"color": "#97c2fc", "id": "Stammspieler", "label": "Stammspieler", "shape": "dot"}, {"color": "#97c2fc", "id": "Sergei", "label": "Sergei", "shape": "dot"}, {"color": "#97c2fc", "id": "Bekha", "label": "Bekha", "shape": "dot"}, {"color": "#97c2fc", "id": "sehen", "label": "sehen", "shape": "dot"}, {"color": "#97c2fc", "id": "beide", "label": "beide", "shape": "dot"}, {"color": "#97c2fc", "id": "Teilnehmer", "label": "Teilnehmer", "shape": "dot"}, {"color": "#97c2fc", "id": "Angriff", "label": "Angriff", "shape": "dot"}, {"color": "#97c2fc", "id": "Grosny", "label": "Grosny", "shape": "dot"}, {"color": "#97c2fc", "id": "1995", "label": "1995", "shape": "dot"}, {"color": "#97c2fc", "id": "1999.", "label": "1999.", "shape": "dot"}, {"color": "#97c2fc", "id": "Kampfgeschicht", "label": "Kampfgeschicht", "shape": "dot"}, {"color": "#97c2fc", "id": "Bot", "label": "Bot", "shape": "dot"}, {"color": "#97c2fc", "id": "werfen", "label": "werfen", "shape": "dot"}, {"color": "#97c2fc", "id": "ver\u00f6ffentlichen", "label": "ver\u00f6ffentlichen", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "K\u00e4mpfer", "to": "Veteran"}, {"from": "Veteran", "to": "unser"}, {"from": "unser", "to": "Kanal"}, {"from": "Kanal", "to": "Tschetschenien-Feldzug"}, {"from": "Tschetschenien-Feldzug", "to": "Bosnien"}, {"from": "Bosnien", "to": "Kosovo"}, {"from": "Kosovo", "to": "Metochie"}, {"from": "Metochie", "to": "tschetschenisch"}, {"from": "tschetschenisch", "to": "Feldzug"}, {"from": "Feldzug", "to": "Mazedonium"}, {"from": "Mazedonium", "to": "Irak"}, {"from": "Irak", "to": "Afghanistan"}, {"from": "Afghanistan", "to": "2000er"}, {"from": "2000er", "to": "Donbass"}, {"from": "Donbass", "to": "Afrika"}, {"from": "Afrika", "to": "SVO"}, {"from": "SVO", "to": "herzlich"}, {"from": "herzlich", "to": "Gl\u00fcckwunsch"}, {"from": "Gl\u00fcckwunsch", "to": "w\u00fcnschen"}, {"from": "w\u00fcnschen", "to": "lang"}, {"from": "lang", "to": "Leben"}, {"from": "Leben", "to": "Foto"}, {"from": "Foto", "to": "Stammspieler"}, {"from": "Stammspieler", "to": "Sergei"}, {"from": "Sergei", "to": "Bekha"}, {"from": "Bekha", "to": "sehen"}, {"from": "sehen", "to": "Veteran"}, {"from": "Veteran", "to": "beide"}, {"from": "beide", "to": "Tschetschenien-Feldzug"}, {"from": "Tschetschenien-Feldzug", "to": "Teilnehmer"}, {"from": "Teilnehmer", "to": "Angriff"}, {"from": "Angriff", "to": "Grosny"}, {"from": "Grosny", "to": "1995"}, {"from": "1995", "to": "1999."}, {"from": "1999.", "to": "Kampfgeschicht"}, {"from": "Kampfgeschicht", "to": "Foto"}, {"from": "Foto", "to": "Bot"}, {"from": "Bot", "to": "werfen"}, {"from": "werfen", "to": "ver\u00f6ffentlichen"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
