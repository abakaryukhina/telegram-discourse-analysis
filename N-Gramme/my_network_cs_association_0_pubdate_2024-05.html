    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "Abonnent", "label": "Abonnent", "shape": "dot"}, {"color": "#97c2fc", "id": "7.", "label": "7.", "shape": "dot"}, {"color": "#97c2fc", "id": "selbst\u00e4ndig", "label": "selbst\u00e4ndig", "shape": "dot"}, {"color": "#97c2fc", "id": "motorisiert", "label": "motorisiert", "shape": "dot"}, {"color": "#97c2fc", "id": "Sch\u00fctzenbrigade", "label": "Sch\u00fctzenbrigade", "shape": "dot"}, {"color": "#97c2fc", "id": "2.", "label": "2.", "shape": "dot"}, {"color": "#97c2fc", "id": "Armeekorps", "label": "Armeekorps", "shape": "dot"}, {"color": "#97c2fc", "id": "Volksmiliz", "label": "Volksmiliz", "shape": "dot"}, {"color": "#97c2fc", "id": "LPR", "label": "LPR", "shape": "dot"}, {"color": "#97c2fc", "id": "Kampftroph\u00e4e", "label": "Kampftroph\u00e4e", "shape": "dot"}, {"color": "#97c2fc", "id": "Lisichansk", "label": "Lisichansk", "shape": "dot"}, {"color": "#97c2fc", "id": "Sommer", "label": "Sommer", "shape": "dot"}, {"color": "#97c2fc", "id": "2022.", "label": "2022.", "shape": "dot"}, {"color": "#97c2fc", "id": "schreiben", "label": "schreiben", "shape": "dot"}, {"color": "#97c2fc", "id": "Bot", "label": "Bot", "shape": "dot"}, {"color": "#97c2fc", "id": "Foto", "label": "Foto", "shape": "dot"}, {"color": "#97c2fc", "id": "Kampfgeschicht", "label": "Kampfgeschicht", "shape": "dot"}, {"color": "#97c2fc", "id": "ver\u00f6ffentlichen", "label": "ver\u00f6ffentlichen", "shape": "dot"}, {"color": "#97c2fc", "id": "sch\u00fcchtern", "label": "sch\u00fcchtern", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "Abonnent", "to": "7."}, {"from": "7.", "to": "selbst\u00e4ndig"}, {"from": "selbst\u00e4ndig", "to": "motorisiert"}, {"from": "motorisiert", "to": "Sch\u00fctzenbrigade"}, {"from": "Sch\u00fctzenbrigade", "to": "2."}, {"from": "2.", "to": "Armeekorps"}, {"from": "Armeekorps", "to": "Volksmiliz"}, {"from": "Volksmiliz", "to": "LPR"}, {"from": "LPR", "to": "Kampftroph\u00e4e"}, {"from": "Kampftroph\u00e4e", "to": "Lisichansk"}, {"from": "Lisichansk", "to": "Sommer"}, {"from": "Sommer", "to": "2022."}, {"from": "2022.", "to": "schreiben"}, {"from": "schreiben", "to": "Bot"}, {"from": "Bot", "to": "Foto"}, {"from": "Foto", "to": "Kampfgeschicht"}, {"from": "Kampfgeschicht", "to": "ver\u00f6ffentlichen"}, {"from": "ver\u00f6ffentlichen", "to": "sch\u00fcchtern"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
