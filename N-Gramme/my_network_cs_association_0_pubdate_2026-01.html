              // initialize global variables.

                  var container = document.getElementById('mynetwork');

                  edges = new vis.DataSet([{"from": "Erde", "to": "k\u00e4mpfen"}, {"from": "D\u00fcmmste", "to": "inl\u00e4ndisch"}, {"from": "inl\u00e4ndisch", "to": "Journalismus"}, {"from": "Journalismus", "to": "maximal"}, {"from": "maximal", "to": "Verleugnung"}, {"from": "Verleugnung", "to": "Realit\u00e4t"}, {"from": "Realit\u00e4t", "to": "Erde"}, {"from": "k\u00e4mpfen", "to": "gleichzeitig"}, {"from": "gleichzeitig", "to": "Erde"}, {"from": "k\u00e4mpfen", "to": "sogar"}, {"from": "sogar", "to": "Drohne"}, {"from": "Drohne", "to": "Himmel"}, {"from": "Himmel", "to": "schie\u00dfen"}, {"from": "schie\u00dfen", "to": "Mensch"}, {"from": "Mensch", "to": "steuern"}, {"from": "steuern", "to": "Erde"}, {"from": "Erde", "to": "wandeln"}, {"from": "wandeln", "to": "wissen"}, {"from": "wissen", "to": "Perle"}, {"from": "Perle", "to": "genauso"}, {"from": "genauso", "to": "dumm"}, {"from": "dumm", "to": "ukrainisch"}, {"from": "ukrainisch", "to": "Konfrontation"}, {"from": "Konfrontation", "to": "RUSSEN"}, {"from": "RUSSEN", "to": "FLIEHEN"}, {"from": "FLIEHEN", "to": "MASSIV"}, {"from": "MASSIV", "to": "ARMEE"}, {"from": "ARMEE", "to": "FRONT"}, {"from": "FRONT", "to": "NACKT"}, {"from": "NACKT", "to": "Journalist"}, {"from": "Journalist", "to": "liegen"}, {"from": "liegen", "to": "falsch"}, {"from": "falsch", "to": "Ukraine"}, {"from": "Ukraine", "to": "Armee"}, {"from": "Armee", "to": "Erde"}, {"from": "k\u00e4mpfen", "to": "k\u00e4mpfen"}, {"from": "k\u00e4mpfen", "to": "ber\u00fccksichtigen"}, {"from": "ber\u00fccksichtigen", "to": "beginnen"}, {"from": "beginnen", "to": "geben"}, {"from": "geben", "to": "falsch"}, {"from": "falsch", "to": "Information"}, {"from": "Information", "to": "Drohne"}, {"from": "Drohne", "to": "genauso"}, {"from": "genauso", "to": "sein"}, {"from": "sein", "to": "geh\u00f6ren"}, {"from": "geh\u00f6ren", "to": "Hymer"}, {"from": "Hymer", "to": "geben"}, {"from": "geben", "to": "bestehen"}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {

                  }

                  // adding nodes and edges to the graph

                  var options = {
    "configure": {

        "filter": [

    },
    "edges": {

        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
