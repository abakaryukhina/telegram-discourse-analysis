        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             
             #config {
                 float: left;
                 width: 400px;
                 height: 600px;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "Abonnent", "label": "Abonnent", "shape": "dot"}, {"color": "#97c2fc", "id": "Soldat", "label": "Soldat", "shape": "dot"}, {"color": "#97c2fc", "id": "8.", "label": "8.", "shape": "dot"}, {"color": "#97c2fc", "id": "Einsatzabteilung", "label": "Einsatzabteilung", "shape": "dot"}, {"color": "#97c2fc", "id": "Rus", "label": "Rus", "shape": "dot"}, {"color": "#97c2fc", "id": "Inneren", "label": "Inneren", "shape": "dot"}, {"color": "#97c2fc", "id": "Truppe", "label": "Truppe", "shape": "dot"}, {"color": "#97c2fc", "id": "Innenministerium", "label": "Innenministerium", "shape": "dot"}, {"color": "#97c2fc", "id": "Dorf", "label": "Dorf", "shape": "dot"}, {"color": "#97c2fc", "id": "Chabanmakhi", "label": "Chabanmakhi", "shape": "dot"}, {"color": "#97c2fc", "id": "Dagestan", "label": "Dagestan", "shape": "dot"}, {"color": "#97c2fc", "id": "August", "label": "August", "shape": "dot"}, {"color": "#97c2fc", "id": "1999.", "label": "1999.", "shape": "dot"}, {"color": "#97c2fc", "id": "sogar", "label": "sogar", "shape": "dot"}, {"color": "#97c2fc", "id": "Elefant", "label": "Elefant", "shape": "dot"}, {"color": "#97c2fc", "id": "KZP", "label": "KZP", "shape": "dot"}, {"color": "#97c2fc", "id": "senden", "label": "senden", "shape": "dot"}, {"color": "#97c2fc", "id": "Foto", "label": "Foto", "shape": "dot"}, {"color": "#97c2fc", "id": "Kampfgeschicht", "label": "Kampfgeschicht", "shape": "dot"}, {"color": "#97c2fc", "id": "Bot", "label": "Bot", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "Abonnent", "to": "Soldat"}, {"from": "Soldat", "to": "8."}, {"from": "8.", "to": "Einsatzabteilung"}, {"from": "Einsatzabteilung", "to": "Rus"}, {"from": "Rus", "to": "Inneren"}, {"from": "Inneren", "to": "Truppe"}, {"from": "Truppe", "to": "Innenministerium"}, {"from": "Innenministerium", "to": "Dorf"}, {"from": "Dorf", "to": "Chabanmakhi"}, {"from": "Chabanmakhi", "to": "Dagestan"}, {"from": "Dagestan", "to": "August"}, {"from": "August", "to": "1999."}, {"from": "1999.", "to": "sogar"}, {"from": "sogar", "to": "Elefant"}, {"from": "Elefant", "to": "KZP"}, {"from": "KZP", "to": "senden"}, {"from": "senden", "to": "Foto"}, {"from": "Foto", "to": "Kampfgeschicht"}, {"from": "Kampfgeschicht", "to": "Bot"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
