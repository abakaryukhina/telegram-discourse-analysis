        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "russisch", "label": "russisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Welt", "label": "Welt", "shape": "dot"}, {"color": "#97c2fc", "id": "Hijab-Liebhaber", "label": "Hijab-Liebhaber", "shape": "dot"}, {"color": "#97c2fc", "id": "Idee", "label": "Idee", "shape": "dot"}, {"color": "#97c2fc", "id": "Tag", "label": "Tag", "shape": "dot"}, {"color": "#97c2fc", "id": "Freund", "label": "Freund", "shape": "dot"}, {"color": "#97c2fc", "id": "Abonnent", "label": "Abonnent", "shape": "dot"}, {"color": "#97c2fc", "id": "April", "label": "April", "shape": "dot"}, {"color": "#97c2fc", "id": "2014", "label": "2014", "shape": "dot"}, {"color": "#97c2fc", "id": "Kommandeur", "label": "Kommandeur", "shape": "dot"}, {"color": "#97c2fc", "id": "Gruppe", "label": "Gruppe", "shape": "dot"}, {"color": "#97c2fc", "id": "Krim-Abteilung", "label": "Krim-Abteilung", "shape": "dot"}, {"color": "#97c2fc", "id": "Slawjansk", "label": "Slawjansk", "shape": "dot"}, {"color": "#97c2fc", "id": "sehen", "label": "sehen", "shape": "dot"}, {"color": "#97c2fc", "id": "Sch\u00f6nes", "label": "Sch\u00f6nes", "shape": "dot"}, {"color": "#97c2fc", "id": "Majest\u00e4tisches", "label": "Majest\u00e4tisches", "shape": "dot"}, {"color": "#97c2fc", "id": "Blau\u00e4ugig", "label": "Blau\u00e4ugig", "shape": "dot"}, {"color": "#97c2fc", "id": "Goldhaarig", "label": "Goldhaarig", "shape": "dot"}, {"color": "#97c2fc", "id": "Hellgesichtige", "label": "Hellgesichtige", "shape": "dot"}, {"color": "#97c2fc", "id": "fasziniert", "label": "fasziniert", "shape": "dot"}, {"color": "#97c2fc", "id": "Sch\u00f6nheit", "label": "Sch\u00f6nheit", "shape": "dot"}, {"color": "#97c2fc", "id": "bereit", "label": "bereit", "shape": "dot"}, {"color": "#97c2fc", "id": "Schicksal", "label": "Schicksal", "shape": "dot"}, {"color": "#97c2fc", "id": "teilen", "label": "teilen", "shape": "dot"}, {"color": "#97c2fc", "id": "egal", "label": "egal", "shape": "dot"}, {"color": "#97c2fc", "id": "national", "label": "national", "shape": "dot"}, {"color": "#97c2fc", "id": "Aufschwung", "label": "Aufschwung", "shape": "dot"}, {"color": "#97c2fc", "id": "Jahrhundert", "label": "Jahrhundert", "shape": "dot"}, {"color": "#97c2fc", "id": "vorkommen", "label": "vorkommen", "shape": "dot"}, {"color": "#97c2fc", "id": "dorthin", "label": "dorthin", "shape": "dot"}, {"color": "#97c2fc", "id": "bringen", "label": "bringen", "shape": "dot"}, {"color": "#97c2fc", "id": "Tulenkov", "label": "Tulenkov", "shape": "dot"}, {"color": "#97c2fc", "id": "definitiv", "label": "definitiv", "shape": "dot"}, {"color": "#97c2fc", "id": "spirituell", "label": "spirituell", "shape": "dot"}, {"color": "#97c2fc", "id": "moralisch", "label": "moralisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Konstruktion", "label": "Konstruktion", "shape": "dot"}, {"color": "#97c2fc", "id": "slawisch", "label": "slawisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Gemeinschaft", "label": "Gemeinschaft", "shape": "dot"}, {"color": "#97c2fc", "id": "gemeinsam", "label": "gemeinsam", "shape": "dot"}, {"color": "#97c2fc", "id": "Staatlichkeit", "label": "Staatlichkeit", "shape": "dot"}, {"color": "#97c2fc", "id": "Romantiker", "label": "Romantiker", "shape": "dot"}, {"color": "#97c2fc", "id": "Patriot", "label": "Patriot", "shape": "dot"}, {"color": "#97c2fc", "id": "anstreben", "label": "anstreben", "shape": "dot"}, {"color": "#97c2fc", "id": "Kiew", "label": "Kiew", "shape": "dot"}, {"color": "#97c2fc", "id": "Schitomir", "label": "Schitomir", "shape": "dot"}, {"color": "#97c2fc", "id": "Sachalin", "label": "Sachalin", "shape": "dot"}, {"color": "#97c2fc", "id": "Kamtschatka", "label": "Kamtschatka", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "russisch", "to": "Welt"}, {"from": "Hijab-Liebhaber", "to": "russisch"}, {"from": "Welt", "to": "Idee"}, {"from": "Tag", "to": "Freund"}, {"from": "Freund", "to": "Abonnent"}, {"from": "Abonnent", "to": "April"}, {"from": "April", "to": "2014"}, {"from": "2014", "to": "Kommandeur"}, {"from": "Kommandeur", "to": "Gruppe"}, {"from": "Gruppe", "to": "Krim-Abteilung"}, {"from": "Krim-Abteilung", "to": "Slawjansk"}, {"from": "Slawjansk", "to": "sehen"}, {"from": "sehen", "to": "russisch"}, {"from": "Welt", "to": "Sch\u00f6nes"}, {"from": "Sch\u00f6nes", "to": "Majest\u00e4tisches"}, {"from": "Majest\u00e4tisches", "to": "Blau\u00e4ugig"}, {"from": "Blau\u00e4ugig", "to": "Goldhaarig"}, {"from": "Goldhaarig", "to": "Hellgesichtige"}, {"from": "Hellgesichtige", "to": "fasziniert"}, {"from": "fasziniert", "to": "Sch\u00f6nheit"}, {"from": "Sch\u00f6nheit", "to": "bereit"}, {"from": "bereit", "to": "Schicksal"}, {"from": "Schicksal", "to": "teilen"}, {"from": "teilen", "to": "egal"}, {"from": "egal", "to": "national"}, {"from": "national", "to": "Aufschwung"}, {"from": "Aufschwung", "to": "Jahrhundert"}, {"from": "Jahrhundert", "to": "vorkommen"}, {"from": "vorkommen", "to": "russisch"}, {"from": "Welt", "to": "Freund"}, {"from": "Freund", "to": "dorthin"}, {"from": "dorthin", "to": "bringen"}, {"from": "bringen", "to": "Tulenkov"}, {"from": "Tulenkov", "to": "definitiv"}, {"from": "definitiv", "to": "Hijab-Liebhaber"}, {"from": "Welt", "to": "spirituell"}, {"from": "spirituell", "to": "moralisch"}, {"from": "moralisch", "to": "Konstruktion"}, {"from": "Konstruktion", "to": "slawisch"}, {"from": "slawisch", "to": "Gemeinschaft"}, {"from": "Gemeinschaft", "to": "gemeinsam"}, {"from": "gemeinsam", "to": "Staatlichkeit"}, {"from": "Staatlichkeit", "to": "Romantiker"}, {"from": "Romantiker", "to": "Patriot"}, {"from": "Patriot", "to": "2014"}, {"from": "2014", "to": "anstreben"}, {"from": "anstreben", "to": "Kiew"}, {"from": "Kiew", "to": "Schitomir"}, {"from": "Schitomir", "to": "Sachalin"}, {"from": "Sachalin", "to": "Kamtschatka"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
