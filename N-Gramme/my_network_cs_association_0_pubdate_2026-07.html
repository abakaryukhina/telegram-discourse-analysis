        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 600px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

                 float: left;

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "Region", "label": "Region", "shape": "dot"}, {"color": "#97c2fc", "id": "Kursk", "label": "Kursk", "shape": "dot"}, {"color": "#97c2fc", "id": "Charkow", "label": "Charkow", "shape": "dot"}, {"color": "#97c2fc", "id": "Sicherheitsstreifen", "label": "Sicherheitsstreifen", "shape": "dot"}, {"color": "#97c2fc", "id": "Ukraine", "label": "Ukraine", "shape": "dot"}, {"color": "#97c2fc", "id": "Gebiet", "label": "Gebiet", "shape": "dot"}, {"color": "#97c2fc", "id": "Sumy", "label": "Sumy", "shape": "dot"}, {"color": "#97c2fc", "id": "Dnepropetrowsk", "label": "Dnepropetrowsk", "shape": "dot"}, {"color": "#97c2fc", "id": "verlaufen", "label": "verlaufen", "shape": "dot"}, {"color": "#97c2fc", "id": "Dmitri", "label": "Dmitri", "shape": "dot"}, {"color": "#97c2fc", "id": "Medwedew", "label": "Medwedew", "shape": "dot"}, {"color": "#97c2fc", "id": "lustig", "label": "lustig", "shape": "dot"}, {"color": "#97c2fc", "id": "Sicherheitszone", "label": "Sicherheitszone", "shape": "dot"}, {"color": "#97c2fc", "id": "sprechen", "label": "sprechen", "shape": "dot"}, {"color": "#97c2fc", "id": "Definition", "label": "Definition", "shape": "dot"}, {"color": "#97c2fc", "id": "aufnehmen", "label": "aufnehmen", "shape": "dot"}, {"color": "#97c2fc", "id": "Art", "label": "Art", "shape": "dot"}, {"color": "#97c2fc", "id": "verdammt", "label": "verdammt", "shape": "dot"}, {"color": "#97c2fc", "id": "Lattenzaun", "label": "Lattenzaun", "shape": "dot"}, {"color": "#97c2fc", "id": "sch\u00fctzen", "label": "sch\u00fctzen", "shape": "dot"}, {"color": "#97c2fc", "id": "Pfeil", "label": "Pfeil", "shape": "dot"}, {"color": "#97c2fc", "id": "fliegen", "label": "fliegen", "shape": "dot"}, {"color": "#97c2fc", "id": "physisch", "label": "physisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Bodensicherheit", "label": "Bodensicherheit", "shape": "dot"}, {"color": "#97c2fc", "id": "Infanterie", "label": "Infanterie", "shape": "dot"}, {"color": "#97c2fc", "id": "beispielsweise", "label": "beispielsweise", "shape": "dot"}, {"color": "#97c2fc", "id": "eindringen", "label": "eindringen", "shape": "dot"}, {"color": "#97c2fc", "id": "Sicherheit", "label": "Sicherheit", "shape": "dot"}, {"color": "#97c2fc", "id": "t\u00e4uschen", "label": "t\u00e4uschen", "shape": "dot"}, {"color": "#97c2fc", "id": "Didid", "label": "Didid", "shape": "dot"}, {"color": "#97c2fc", "id": "objektiv", "label": "objektiv", "shape": "dot"}, {"color": "#97c2fc", "id": "Drohne", "label": "Drohne", "shape": "dot"}, {"color": "#97c2fc", "id": "Distanz", "label": "Distanz", "shape": "dot"}, {"color": "#97c2fc", "id": "200", "label": "200", "shape": "dot"}, {"color": "#97c2fc", "id": "Kilometer", "label": "Kilometer", "shape": "dot"}, {"color": "#97c2fc", "id": "S\u00fcden", "label": "S\u00fcden", "shape": "dot"}, {"color": "#97c2fc", "id": "Norden", "label": "Norden", "shape": "dot"}, {"color": "#97c2fc", "id": "Grenze", "label": "Grenze", "shape": "dot"}, {"color": "#97c2fc", "id": "Russischen", "label": "Russischen", "shape": "dot"}, {"color": "#97c2fc", "id": "F\u00f6deration", "label": "F\u00f6deration", "shape": "dot"}, {"color": "#97c2fc", "id": "sogar", "label": "sogar", "shape": "dot"}, {"color": "#97c2fc", "id": "Hymer", "label": "Hymer", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "Region", "to": "Kursk"}, {"from": "Region", "to": "Charkow"}, {"from": "Sicherheitsstreifen", "to": "Ukraine"}, {"from": "Ukraine", "to": "Gebiet"}, {"from": "Gebiet", "to": "Region"}, {"from": "Region", "to": "Sumy"}, {"from": "Sumy", "to": "Dnepropetrowsk"}, {"from": "Dnepropetrowsk", "to": "Charkow"}, {"from": "Charkow", "to": "verlaufen"}, {"from": "verlaufen", "to": "Dmitri"}, {"from": "Dmitri", "to": "Medwedew"}, {"from": "Medwedew", "to": "lustig"}, {"from": "Medwedew", "to": "Sicherheitszone"}, {"from": "Sicherheitszone", "to": "sprechen"}, {"from": "sprechen", "to": "Definition"}, {"from": "Definition", "to": "aufnehmen"}, {"from": "aufnehmen", "to": "Art"}, {"from": "Art", "to": "verdammt"}, {"from": "verdammt", "to": "Lattenzaun"}, {"from": "Lattenzaun", "to": "sprechen"}, {"from": "sprechen", "to": "sch\u00fctzen"}, {"from": "sch\u00fctzen", "to": "Pfeil"}, {"from": "Pfeil", "to": "fliegen"}, {"from": "fliegen", "to": "physisch"}, {"from": "physisch", "to": "Bodensicherheit"}, {"from": "Bodensicherheit", "to": "sprechen"}, {"from": "sprechen", "to": "Infanterie"}, {"from": "Infanterie", "to": "beispielsweise"}, {"from": "beispielsweise", "to": "Region"}, {"from": "Kursk", "to": "eindringen"}, {"from": "eindringen", "to": "Sicherheit"}, {"from": "Sicherheit", "to": "sprechen"}, {"from": "sprechen", "to": "t\u00e4uschen"}, {"from": "t\u00e4uschen", "to": "Didid"}, {"from": "t\u00e4uschen", "to": "objektiv"}, {"from": "objektiv", "to": "Drohne"}, {"from": "Drohne", "to": "Distanz"}, {"from": "Distanz", "to": "200"}, {"from": "200", "to": "Kilometer"}, {"from": "Kilometer", "to": "Region"}, {"from": "Charkow", "to": "S\u00fcden"}, {"from": "S\u00fcden", "to": "Norden"}, {"from": "Norden", "to": "Grenze"}, {"from": "Grenze", "to": "Russischen"}, {"from": "Russischen", "to": "F\u00f6deration"}, {"from": "F\u00f6deration", "to": "fliegen"}, {"from": "fliegen", "to": "sogar"}, {"from": "sogar", "to": "Hymer"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
