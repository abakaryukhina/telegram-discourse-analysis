                  edges = new vis.DataSet([{"from": "basieren", "to": "ausschlie\u00dflich"}, {"from": "ausschlie\u00dflich", "to": "Idee"}, {"from": "Idee", "to": "eigentlich"}, {"from": "eigentlich", "to": "materiell"}, {"from": "materiell", "to": "Reichtum"}, {"from": "Reichtum", "to": "denken"}, {"from": "denken", "to": "Belohnung"}, {"from": "denken", "to": "gelten"}, {"from": "gelten", "to": "unw\u00fcrdig"}, {"from": "unw\u00fcrdig", "to": "diskreditierend"}, {"from": "diskreditierend", "to": "Geld"}, {"from": "Geld", "to": "Teilnahme"}, {"from": "Teilnahme", "to": "Krieg"}, {"from": "Krieg", "to": "erhalten"}, {"from": "erhalten", "to": "Idee"}, {"from": "Idee", "to": "Ansporn"}, {"from": "Ansporn", "to": "\u00fcberleben"}, {"from": "\u00fcberleben", "to": "vorankommen"}, {"from": "vorankommen", "to": "massiv"}, {"from": "massiv", "to": "Aufstand"}, {"from": "Aufstand", "to": "23"}, {"from": "23", "to": "Unabh\u00e4ngigkeit"}, {"from": "Unabh\u00e4ngigkeit", "to": "Ukraine"}, {"from": "Ukraine", "to": "kochen"}, {"from": "kochen", "to": "echt"}, {"from": "echt", "to": "Aufstand"}, {"from": "Aufstand", "to": "Film"}, {"from": "Film", "to": "zeigen"}, {"from": "zeigen", "to": "Barfu\u00df"}, {"from": "Barfu\u00df", "to": "zerrissen"}, {"from": "zerrissen", "to": "Hose"}, {"from": "Hose", "to": "alt"}, {"from": "alt", "to": "Kalash"}, {"from": "Kalash", "to": "Hand"}, {"from": "Hand", "to": "Auge"}, {"from": "Auge", "to": "Welt"}, {"from": "Welt", "to": "Spinner"}, {"from": "Spinner", "to": "sogar"}, {"from": "sogar", "to": "Betrunkener"}, {"from": "Betrunkener", "to": "Graben"}, {"from": "Graben", "to": "sitzen"}, {"from": "sitzen", "to": "treiben"}, {"from": "treiben", "to": "weitermachen"}, {"from": "weitermachen", "to": "Hypothek"}, {"from": "Hypothek", "to": "aufl\u00f6sen"}, {"from": "aufl\u00f6sen", "to": "Geist"}, {"from": "Geist", "to": "Rebellion"}, {"from": "Rebellion", "to": "vorw\u00e4rts"}, {"from": "vorw\u00e4rts", "to": "treiben"}]);

                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {

        "filter": [

    },
    "edges": {

        "smooth": {

    },
    "interaction": {

        "hideNodesOnDrag": false
    },
    "physics": {

        "stabilization": {

            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,

                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
