        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {

              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "beispielsweise", "label": "beispielsweise", "shape": "dot"}, {"color": "#97c2fc", "id": "fordern", "label": "fordern", "shape": "dot"}, {"color": "#97c2fc", "id": "Herr", "label": "Herr", "shape": "dot"}, {"color": "#97c2fc", "id": "Tulenkov", "label": "Tulenkov", "shape": "dot"}, {"color": "#97c2fc", "id": "lautstark", "label": "lautstark", "shape": "dot"}, {"color": "#97c2fc", "id": "baldig", "label": "baldig", "shape": "dot"}, {"color": "#97c2fc", "id": "Kapitulation", "label": "Kapitulation", "shape": "dot"}, {"color": "#97c2fc", "id": "Russland", "label": "Russland", "shape": "dot"}, {"color": "#97c2fc", "id": "erwarten", "label": "erwarten", "shape": "dot"}, {"color": "#97c2fc", "id": "Zukunft", "label": "Zukunft", "shape": "dot"}, {"color": "#97c2fc", "id": "schlimm", "label": "schlimm", "shape": "dot"}, {"color": "#97c2fc", "id": "Szenario", "label": "Szenario", "shape": "dot"}, {"color": "#97c2fc", "id": "nennen", "label": "nennen", "shape": "dot"}, {"color": "#97c2fc", "id": "sagen", "label": "sagen", "shape": "dot"}, {"color": "#97c2fc", "id": "unm\u00f6glich", "label": "unm\u00f6glich", "shape": "dot"}, {"color": "#97c2fc", "id": "Leichenfresser", "label": "Leichenfresser", "shape": "dot"}, {"color": "#97c2fc", "id": "Lustige", "label": "Lustige", "shape": "dot"}, {"color": "#97c2fc", "id": "Memoire", "label": "Memoire", "shape": "dot"}, {"color": "#97c2fc", "id": "Krieg", "label": "Krieg", "shape": "dot"}, {"color": "#97c2fc", "id": "Ukrainer", "label": "Ukrainer", "shape": "dot"}, {"color": "#97c2fc", "id": "ber\u00fchmt", "label": "ber\u00fchmt", "shape": "dot"}, {"color": "#97c2fc", "id": "Gehalt", "label": "Gehalt", "shape": "dot"}, {"color": "#97c2fc", "id": "Gewinn", "label": "Gewinn", "shape": "dot"}, {"color": "#97c2fc", "id": "erhalten", "label": "erhalten", "shape": "dot"}, {"color": "#97c2fc", "id": "schnell", "label": "schnell", "shape": "dot"}, {"color": "#97c2fc", "id": "Ausstieg", "label": "Ausstieg", "shape": "dot"}, {"color": "#97c2fc", "id": "Konflikt", "label": "Konflikt", "shape": "dot"}, {"color": "#97c2fc", "id": "sprechen", "label": "sprechen", "shape": "dot"}, {"color": "#97c2fc", "id": "gleichzeitig", "label": "gleichzeitig", "shape": "dot"}, {"color": "#97c2fc", "id": "nehmen", "label": "nehmen", "shape": "dot"}, {"color": "#97c2fc", "id": "Buch", "label": "Buch", "shape": "dot"}, {"color": "#97c2fc", "id": "Verkauf", "label": "Verkauf", "shape": "dot"}, {"color": "#97c2fc", "id": "Gegenteil", "label": "Gegenteil", "shape": "dot"}, {"color": "#97c2fc", "id": "stolz", "label": "stolz", "shape": "dot"}, {"color": "#97c2fc", "id": "Grundlage", "label": "Grundlage", "shape": "dot"}, {"color": "#97c2fc", "id": "Produktion", "label": "Produktion", "shape": "dot"}, {"color": "#97c2fc", "id": "verfilmen", "label": "verfilmen", "shape": "dot"}, {"color": "#97c2fc", "id": "wunderbar", "label": "wunderbar", "shape": "dot"}, {"color": "#97c2fc", "id": "Werk", "label": "Werk", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "beispielsweise", "to": "fordern"}, {"from": "fordern", "to": "Herr"}, {"from": "Herr", "to": "Tulenkov"}, {"from": "Tulenkov", "to": "lautstark"}, {"from": "lautstark", "to": "baldig"}, {"from": "baldig", "to": "Kapitulation"}, {"from": "Kapitulation", "to": "Kapitulation"}, {"from": "Kapitulation", "to": "Russland"}, {"from": "Russland", "to": "erwarten"}, {"from": "erwarten", "to": "Zukunft"}, {"from": "Zukunft", "to": "schlimm"}, {"from": "schlimm", "to": "Szenario"}, {"from": "Szenario", "to": "nennen"}, {"from": "nennen", "to": "sagen"}, {"from": "sagen", "to": "unm\u00f6glich"}, {"from": "unm\u00f6glich", "to": "nennen"}, {"from": "nennen", "to": "Leichenfresser"}, {"from": "Leichenfresser", "to": "Lustige"}, {"from": "Lustige", "to": "Tulenkov"}, {"from": "Tulenkov", "to": "Memoire"}, {"from": "Memoire", "to": "Krieg"}, {"from": "Krieg", "to": "Ukrainer"}, {"from": "Ukrainer", "to": "ber\u00fchmt"}, {"from": "ber\u00fchmt", "to": "Gehalt"}, {"from": "Gehalt", "to": "Gewinn"}, {"from": "Gewinn", "to": "erhalten"}, {"from": "erhalten", "to": "Kapitulation"}, {"from": "Kapitulation", "to": "schnell"}, {"from": "schnell", "to": "Ausstieg"}, {"from": "Ausstieg", "to": "Konflikt"}, {"from": "Konflikt", "to": "sprechen"}, {"from": "sprechen", "to": "gleichzeitig"}, {"from": "gleichzeitig", "to": "nehmen"}, {"from": "nehmen", "to": "Buch"}, {"from": "Buch", "to": "Verkauf"}, {"from": "Verkauf", "to": "Gegenteil"}, {"from": "Gegenteil", "to": "stolz"}, {"from": "stolz", "to": "Grundlage"}, {"from": "Grundlage", "to": "Produktion"}, {"from": "Produktion", "to": "verfilmen"}, {"from": "verfilmen", "to": "wunderbar"}, {"from": "wunderbar", "to": "Werk"}, {"from": "Werk", "to": "Herr"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
