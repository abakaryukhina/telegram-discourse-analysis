                 width: 100%;

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "id": "Angriff", "label": "Angriff", "shape": "dot"}, {"color": "#97c2fc", "id": "Tokmak", "label": "Tokmak", "shape": "dot"}, {"color": "#97c2fc", "id": "Vergeltung", "label": "Vergeltung", "shape": "dot"}, {"color": "#97c2fc", "id": "Kiew", "label": "Kiew", "shape": "dot"}, {"color": "#97c2fc", "id": "werten", "label": "werten", "shape": "dot"}, {"color": "#97c2fc", "id": "Tag", "label": "Tag", "shape": "dot"}, {"color": "#97c2fc", "id": "erneut", "label": "erneut", "shape": "dot"}, {"color": "#97c2fc", "id": "Rakete", "label": "Rakete", "shape": "dot"}, {"color": "#97c2fc", "id": "russisch", "label": "russisch", "shape": "dot"}, {"color": "#97c2fc", "id": "Territorium", "label": "Territorium", "shape": "dot"}, {"color": "#97c2fc", "id": "abfeuern", "label": "abfeuern", "shape": "dot"}, {"color": "#97c2fc", "id": "Hochhaus", "label": "Hochhaus", "shape": "dot"}, {"color": "#97c2fc", "id": "Ukraine", "label": "Ukraine", "shape": "dot"}, {"color": "#97c2fc", "id": "fliegen", "label": "fliegen", "shape": "dot"}, {"color": "#97c2fc", "id": "Mensch", "label": "Mensch", "shape": "dot"}, {"color": "#97c2fc", "id": "sterben", "label": "sterben", "shape": "dot"}, {"color": "#97c2fc", "id": "n\u00f6rdlich", "label": "n\u00f6rdlich", "shape": "dot"}, {"color": "#97c2fc", "id": "Milit\u00e4rbezirk", "label": "Milit\u00e4rbezirk", "shape": "dot"}, {"color": "#97c2fc", "id": "erlangen", "label": "erlangen", "shape": "dot"}, {"color": "#97c2fc", "id": "unkontrollierbar", "label": "unkontrollierbar", "shape": "dot"}, {"color": "#97c2fc", "id": "Bild", "label": "Bild", "shape": "dot"}, {"color": "#97c2fc", "id": "st\u00e4ndig", "label": "st\u00e4ndig", "shape": "dot"}, {"color": "#97c2fc", "id": "Antwort", "label": "Antwort", "shape": "dot"}, {"color": "#97c2fc", "id": "Rache", "label": "Rache", "shape": "dot"}, {"color": "#97c2fc", "id": "fr\u00fch", "label": "fr\u00fch", "shape": "dot"}, {"color": "#97c2fc", "id": "Ank\u00f6mmlinge", "label": "Ank\u00f6mmlinge", "shape": "dot"}, {"color": "#97c2fc", "id": "Hinterland", "label": "Hinterland", "shape": "dot"}, {"color": "#97c2fc", "id": "schwierig", "label": "schwierig", "shape": "dot"}, {"color": "#97c2fc", "id": "stoppen", "label": "stoppen", "shape": "dot"}]);
                  edges = new vis.DataSet([{"from": "Angriff", "to": "Tokmak"}, {"from": "Tokmak", "to": "Vergeltung"}, {"from": "Vergeltung", "to": "Angriff"}, {"from": "Angriff", "to": "Kiew"}, {"from": "Kiew", "to": "werten"}, {"from": "werten", "to": "Tag"}, {"from": "Tag", "to": "erneut"}, {"from": "erneut", "to": "Rakete"}, {"from": "Rakete", "to": "russisch"}, {"from": "russisch", "to": "Territorium"}, {"from": "Territorium", "to": "abfeuern"}, {"from": "abfeuern", "to": "Hochhaus"}, {"from": "Hochhaus", "to": "Ukraine"}, {"from": "Ukraine", "to": "fliegen"}, {"from": "fliegen", "to": "Mensch"}, {"from": "Mensch", "to": "sterben"}, {"from": "sterben", "to": "n\u00f6rdlich"}, {"from": "n\u00f6rdlich", "to": "Milit\u00e4rbezirk"}, {"from": "Milit\u00e4rbezirk", "to": "erlangen"}, {"from": "erlangen", "to": "unkontrollierbar"}, {"from": "unkontrollierbar", "to": "Bild"}, {"from": "Bild", "to": "st\u00e4ndig"}, {"from": "st\u00e4ndig", "to": "Antwort"}, {"from": "Antwort", "to": "Rache"}, {"from": "Rache", "to": "fr\u00fch"}, {"from": "fr\u00fch", "to": "Ank\u00f6mmlinge"}, {"from": "Ank\u00f6mmlinge", "to": "Hinterland"}, {"from": "Hinterland", "to": "schwierig"}, {"from": "schwierig", "to": "stoppen"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
