                  edges = new vis.DataSet([{"from": "Geld", "to": "verlieren"}, {"from": "sperren", "to": "Zentralbank"}, {"from": "h\u00f6ren", "to": "Bef\u00fcrworter"}, {"from": "Bef\u00fcrworter", "to": "Tatsache"}, {"from": "Tatsache", "to": "versuchen"}, {"from": "versuchen", "to": "Russland"}, {"from": "Russland", "to": "Chim\u00e4re"}, {"from": "Chim\u00e4re", "to": "Anschein"}, {"from": "Anschein", "to": "Freiheit"}, {"from": "Freiheit", "to": "echt"}, {"from": "echt", "to": "Gulag"}, {"from": "Gulag", "to": "Ausgabe"}, {"from": "Ausgabe", "to": "Situation"}, {"from": "Situation", "to": "Privatleben"}, {"from": "Privatleben", "to": "verfolgen"}, {"from": "verfolgen", "to": "bleiben"}, {"from": "bleiben", "to": "Mikrochip"}, {"from": "Mikrochip", "to": "beginnen"}, {"from": "beginnen", "to": "Leute"}, {"from": "Leute", "to": "Vieh"}, {"from": "Vieh", "to": "Nacken"}, {"from": "Nacken", "to": "brandmarken"}, {"from": "brandmarken", "to": "Eigentum"}, {"from": "Eigentum", "to": "Nummer"}, {"from": "Nummer", "to": "Nabiullina"}, {"from": "Nabiullina", "to": "Initiative"}, {"from": "Initiative", "to": "Transaktion"}, {"from": "Transaktion", "to": "verfolgen"}, {"from": "verfolgen", "to": "f\u00fchren"}, {"from": "f\u00fchren", "to": "Mensch"}, {"from": "Mensch", "to": "massenhaft"}, {"from": "massenhaft", "to": "Geld"}, {"from": "verlieren", "to": "\u00dcberweisung"}, {"from": "\u00dcberweisung", "to": "verd\u00e4chtig"}, {"from": "\u00dcberweisung", "to": "blockieren"}, {"from": "blockieren", "to": "insbesondere"}, {"from": "insbesondere", "to": "Betrag"}, {"from": "Betrag", "to": "100.000"}, {"from": "100.000", "to": "\u00fcberweisen"}, {"from": "\u00fcberweisen", "to": "stellen"}, {"from": "stellen", "to": "Mensch"}, {"from": "Mensch", "to": "geben"}, {"from": "geben", "to": "angesammelt"}, {"from": "angesammelt", "to": "Familiengeld"}, {"from": "Familiengeld", "to": "\u00fcberleben"}, {"from": "\u00fcberleben", "to": "pers\u00f6nlich"}, {"from": "pers\u00f6nlich", "to": "Karte"}, {"from": "Karte", "to": "sperren"}, {"from": "sperren", "to": "pers\u00f6nlich"}]);

                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {

            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
